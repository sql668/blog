baseURL = "https://sql668.github.io/blog/"
languageCode = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true
title = "史庆亮的博客"
theme = "PaperMod"
enableRobotsTXT = true
paginate = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author = "史庆亮"
  description = "AI 工程、Agent 实践与前端的踩坑记录"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = "你好,这里是繁星的BLOG"
    Content = "这里记录 AI 工程、Agent 落地与前端的踩坑与思考。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/sql668"
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[menu]
  [[menu.main]]
    name = "文章"
    url = "posts/"
    weight = 10
  [[menu.main]]
    name = "标签"
    url = "tags/"
    weight = 20
  [[menu.main]]
    name = "归档"
    url = "archives/"
    weight = 30
